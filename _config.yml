# Setup
title: Gabriel Jones
tagline: Mi piace leggere - nulla da aggiungere vostro onore
url: https://gabrielmatteojones.github.io/jekyll-lib/
paginate: 1
baseurl: ""
permalink: pretty

# Gems
plugins:
  - jekyll-gist
  - jekyll-paginate
  - jekyll-seo-tag

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# ga_analytics: UA-000000-0

# Specify the author for blog posts
author:
  name: Gabriel Jones
  url: https://18f.it/
  email: gabriel.jones@18f.it

# Custom vars
version: 3.0.0
